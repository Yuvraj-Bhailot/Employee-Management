<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<form action="registerManager" method="post">
<fieldset>
<legend> <h2>Manager Registration Form</h2> </legend>

ENTER EMPLOYEE ID: <input type="number" name="id"> <br> <br>
ENTER EMPLOYEE NAME: <input type="text" name="name"> <br> <br>
ENTER EMPLOYEE EMAIL: <input type="email" name="email"> <br> <br>
ENTER EMPLOYEE PASSWORD: <input type="password" name="password"> <br> <br>
ENTER EMPLOYEE PHONE NUMBER: <input type="tel" name="phoneNumber"> <br> <br>
ENTER EMPLOYEE SALARY: <input type="number" name="salary" step="0.01"> <br> <br>
<input type="submit" value="REGISTER" class="button"> 

</fieldset>
</form>

</body>
</html>
