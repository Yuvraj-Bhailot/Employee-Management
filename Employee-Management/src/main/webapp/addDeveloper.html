<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Developer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<form action="addDeveloper" method="post">
<fieldset>
<legend> <h2>Add Developer Form</h2> </legend>

ENTER DEVELOPER ID: <input type="number" name="id"> <br> <br>
ENTER DEVELOPER NAME: <input type="text" name="name"> <br> <br>
ENTER DEVELOPER EMAIL: <input type="email" name="email"> <br> <br>
ENTER DEVELOPER PASSWORD: <input type="password" name="password"> <br> <br>
ENTER DEVELOPER PHONE NUMBER: <input type="tel" name="phoneNumber"> <br> <br>
ENTER DEVELOPER SALARY: <input type="number" name="salary" step="0.01"> <br> <br>
<input type="submit" value="ADD DEVELOPER" class="button"> 

</fieldset>
</form>

</body>
</html>
